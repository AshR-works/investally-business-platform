<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1818 862" width="1818" height="862" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Facturation et encaissement">
<title>F4 — Facturation et encaissement</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1818" height="862" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Facturation et encaissement</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Agrément honoré ou inscription confirmée → facture → paiement → reçu. Module Finance de l’ERP.</text><text x="1798" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">F4 · À venir</text>
<rect x="0" y="84" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text><rect x="0" y="212" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="340" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="408" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">DAF (Finance)</text><rect x="0" y="468" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="468" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="536" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Client (externe)</text>
<polyline points="275,178 275,276 380,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="453,306 453,404 558,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="704,404 736,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,434 809,532 914,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,502 987,404 1087,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1243,404 1270,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1165,358 1165,276 1270,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1416,404 1432,404 1432,148 1448,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,148 1684,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="202" y="118" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="275" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Inscription confirmée :</text><text x="275" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">demande de facturation</text><text x="216" y="122" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="380" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Compléter la demande</text><text x="453" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(référence, conditions)</text><rect x="558" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Émettre la facture</text><text x="631" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(numéro, TVA, mentions)</text><circle cx="702" cy="376" r="10" fill="#b3541e"/><text x="702" y="380" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="736" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Envoyer la facture au</text><text x="809" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">client</text><rect x="914" y="502" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="987" y="536" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Payer par virement</text><polygon points="1165,358 1243,404 1165,450 1087,404" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="401.25" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Paiement reçu à</text><text x="1165" y="414.75" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">l’échéance ?</text><rect x="1270" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Enregistrer le paiement</text><text x="1343" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">et émettre le reçu</text><rect x="1270" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Relancer le client pour</text><text x="1343" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">le paiement</text><rect x="1448" y="118" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Statut « réglé » :</text><text x="1521" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">inscription et tableaux</text><text x="1521" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">de bord</text><text x="1462" y="122" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><circle cx="1699" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="1251" y="398" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="1173" y="350" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text>
<rect x="20" y="610" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="610" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,610 784,618 770,626 756,618" fill="#fff" stroke="#2f2c2a"/><text x="796" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="650" r="10" fill="#b3541e"/><text x="32" y="654" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="654" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Une facture émise est immuable : toute correction passe par un avoir ; total = somme des lignes, au centime.</text><text x="20" y="687" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="707" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Les paiements cumulés ne dépassent pas le total de la facture.</text><text x="26" y="726" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le DAF exporte les documents de sa gestion financière et fiscale, avec trace.</text><text x="20" y="755" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="775" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Mentions légales, numérotation (par exemple FAC-2026-0042, remise à zéro annuelle) et TVA (19,25 %) : à valider avec le DAF.</text><text x="26" y="794" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Qui déclenche la facture : l’inscription confirmée, l’agrément honoré, ou une décision manuelle ?</text><text x="26" y="813" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Conditions de paiement et pénalités de retard à faire figurer.</text>
</svg>