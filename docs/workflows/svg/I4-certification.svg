<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1818 923" width="1818" height="923" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Certificat, attestation et suggestion d’ambassadeur">
<title>I4 — Certificat, attestation et suggestion d’ambassadeur</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1818" height="923" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Certificat, attestation et suggestion d’ambassadeur</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Session clôturée → décider certificat ou attestation → document selon la charte → événement → suggestion d’ambassadeur au chargé de compte. Sprint S5.3.</text><text x="1798" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">I4 · À venir</text>
<rect x="0" y="84" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="144.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Responsable</text><text x="78" y="159.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Investudy</text><rect x="0" y="212" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text><rect x="0" y="340" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="408" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="468" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="468" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="528.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Apprenant</text><text x="78" y="543.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">(externe)</text>
<polyline points="290,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="526,148 553,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="631,194 631,276 736,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="709,148 736,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="882,276 914,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="882,148 972,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,306 987,404 1092,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,306 987,532 1092,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1238,404 1265,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1421,404 1448,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1343,358 1343,276 1506,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,404 1684,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="275" cy="148" r="15" fill="#fff" stroke="#2f2c2a" stroke-width="2"/><rect x="380" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Ouvrir « À délivrer »</text><text x="453" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">pour une session</text><text x="453" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">clôturée</text><polygon points="631,102 709,148 631,194 553,148" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="138.5" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Seuils de note et</text><text x="631" y="152" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">de présence</text><text x="631" y="165.5" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">atteints ?</text><circle cx="707" cy="104" r="10" fill="#b3541e"/><text x="707" y="108" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="736" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Certificat de réussite</text><text x="809" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">généré selon la charte</text><text x="750" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="736" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Délivrer une</text><text x="809" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">attestation de suivi,</text><text x="809" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">ou aucune pièce</text><circle cx="987" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><text x="987" y="179" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">Attestation remise</text><rect x="914" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="266.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Événement «</text><text x="987" y="280" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">certification délivrée</text><text x="987" y="293.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">» émis</text><text x="928" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="1092" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Reçoit la suggestion «</text><text x="1165" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">créer un ambassadeur »</text><circle cx="1236" cy="376" r="10" fill="#b3541e"/><text x="1236" y="380" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="1092" y="502" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1165" y="522.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Reçoit son certificat</text><text x="1165" y="536" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(remis par le</text><text x="1165" y="549.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">personnel)</text><polygon points="1343,358 1421,404 1343,450 1265,404" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="401.25" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Créer</text><text x="1343" y="414.75" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">l’ambassadeur ?</text><rect x="1448" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Créer l’ambassadeur</text><text x="1521" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(origine : apprenant)</text><circle cx="1521" cy="276" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><text x="1521" y="307" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">Suggestion classée</text><circle cx="1699" cy="404" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="639" y="210" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="717" y="142" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text><text x="1429" y="398" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="1351" y="350" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text>
<rect x="20" y="610" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="610" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,610 784,618 770,626 756,618" fill="#fff" stroke="#2f2c2a"/><text x="796" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="650" r="10" fill="#b3541e"/><text x="32" y="654" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="654" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Seuils non décidés : proposition de départ à valider (par exemple présence d’au moins 80 % et note d’au moins 10 sur 20).</text><circle cx="32" cy="673" r="10" fill="#b3541e"/><text x="32" y="677" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="677" font-size="12" font-weight="400" fill="#262626" text-anchor="start">La certification ne fait que suggérer : la création de l’ambassadeur est toujours une décision manuelle du chargé de compte.</text><text x="20" y="710" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="730" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un certificat n’est délivré qu’à partir d’une session clôturée.</text><text x="26" y="749" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Une révocation exige une justification et une confirmation à l’écran ; le document révoqué reste consultable, marqué « révoqué ».</text><text x="26" y="768" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Seul le Responsable Investudy délivre et révoque ; les chargés de compte ne lisent pas les certifications aujourd’hui (voir points à trancher).</text><text x="26" y="787" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le document suit la charte graphique (en attente du graphiste et des mentions légales du DAF).</text><text x="20" y="816" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="836" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Seuils de réussite et de présence pour un certificat ou une attestation.</text><text x="26" y="855" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Numérotation et vérification d’un certificat (numéro, code, durée de validité) ?</text><text x="26" y="874" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le chargé de compte doit pouvoir voir la suggestion sans lire toutes les certifications : droit dédié ou notification seule ?</text>
</svg>