<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 572" width="1640" height="572" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Documents et pièces jointes">
<title>F7 — Documents et pièces jointes</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1640" height="572" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Documents et pièces jointes</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Téléversement → contrôles → empreinte → versions → historique → archivage. Documents (S3.6).</text><text x="1620" y="32" font-size="12" font-weight="700" fill="#2e7d32" text-anchor="end">F7 · Réalisé</text>
<rect x="0" y="84" width="1640" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Utilisateur</text><rect x="0" y="212" width="1640" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text>
<polyline points="275,178 275,276 375,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="531,276 558,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="453,230 453,148 616,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="704,276 736,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="882,276 914,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,246 987,148 1092,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1238,148 1270,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1416,148 1506,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="202" y="118" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="275" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Téléverser un document</text><text x="275" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">ou une version</text><polygon points="453,230 531,276 453,322 375,276" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="273.25" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Format et contenu</text><text x="453" y="286.75" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">valides ?</text><circle cx="529" cy="232" r="10" fill="#b3541e"/><text x="529" y="236" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="631" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><text x="631" y="179" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">Refus expliqué</text><rect x="558" y="246" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Calculer l’empreinte</text><text x="631" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">SHA-256 et stocker</text><rect x="736" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="280" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Analyse antivirus</text><circle cx="880" cy="248" r="10" fill="#b3541e"/><text x="880" y="252" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="914" y="246" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Créer la version et</text><text x="987" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">tracer</text><rect x="1092" y="118" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Consulter l’historique</text><text x="1165" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">et télécharger</text><rect x="1270" y="118" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Archiver (avec</text><text x="1343" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">confirmation)</text><circle cx="1521" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="539" y="270" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="461" y="222" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text>
<rect x="20" y="354" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="366" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="354" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="366" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="354" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="366" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="354" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="366" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,354 784,362 770,370 756,362" fill="#fff" stroke="#2f2c2a"/><text x="796" y="366" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="394" r="10" fill="#b3541e"/><text x="32" y="398" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="398" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Le contenu est vérifié, pas seulement l’extension.</text><circle cx="32" cy="417" r="10" fill="#b3541e"/><text x="32" y="421" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="421" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Prévue avant la mise en production ; aujourd’hui le statut affiché est « Non analysé ».</text><text x="20" y="454" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="474" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un document appartient à un objet (entreprise, apprenant…) et hérite de sa portée ; un document hors portée est « introuvable ».</text><text x="20" y="503" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="523" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Formats et tailles autorisés, durée de conservation : valeurs par défaut à confirmer (D22).</text>
</svg>