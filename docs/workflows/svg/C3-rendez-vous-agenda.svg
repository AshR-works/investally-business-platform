<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 772" width="1640" height="772" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Rendez-vous, visite et agenda">
<title>C3 — Rendez-vous, visite et agenda</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1640" height="772" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Rendez-vous, visite et agenda</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Planifier → éviter les conflits → tenir, annuler ou reporter → alimenter l’opportunité. Sprints S4.2b et S4.3.</text><text x="1620" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">C3 · À venir</text>
<rect x="0" y="84" width="1640" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="212" width="1640" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text><rect x="0" y="340" width="1640" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="400.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Contact</text><text x="78" y="415.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">(externe)</text>
<polyline points="290,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="453,178 453,276 553,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="631,230 631,178" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="709,276 736,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,306 809,404 914,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,374 987,148 1092,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1165,178 1165,276 1270,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1416,276 1506,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="275" cy="148" r="15" fill="#fff" stroke="#2f2c2a" stroke-width="2"/><rect x="380" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Planifier un</text><text x="453" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">rendez-vous (type,</text><text x="453" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">contact, date, lieu)</text><circle cx="524" cy="120" r="10" fill="#b3541e"/><text x="524" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><polygon points="631,230 709,276 631,322 553,276" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="273.25" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Conflit d’horaire</text><text x="631" y="286.75" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">?</text><rect x="558" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Choisir un autre</text><text x="631" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">créneau</text><rect x="736" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="266.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Enregistré dans</text><text x="809" y="280" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">l’agenda, rappel</text><text x="809" y="293.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">programmé</text><text x="750" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="914" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="987" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Participe au</text><text x="987" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">rendez-vous</text><rect x="1092" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Marquer tenu, annulé ou</text><text x="1165" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">reporté, avec une note</text><rect x="1270" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Opportunité mise à jour</text><text x="1343" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(RDV décideur tenu)</text><text x="1284" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><circle cx="1414" cy="248" r="10" fill="#b3541e"/><text x="1414" y="252" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="1521" cy="276" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="639" y="222" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="717" y="270" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text>
<rect x="20" y="482" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="482" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,482 784,490 770,498 756,490" fill="#fff" stroke="#2f2c2a"/><text x="796" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="522" r="10" fill="#b3541e"/><text x="32" y="526" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="526" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Types : RDV DAF, RDV décideur, visite chez Investally.</text><circle cx="32" cy="545" r="10" fill="#b3541e"/><text x="32" y="549" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="549" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Un rendez-vous décideur tenu débloque l’accord de principe (flux F1).</text><text x="20" y="582" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="602" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un agenda se lit selon la portée : le chargé de compte voit le sien, le Responsable commercial celui de son équipe. Les agendas partagés suivent une règle</text><text x="26" y="617" font-size="12" font-weight="400" fill="#262626" text-anchor="start">d’audience (D60).</text><text x="26" y="636" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un rendez-vous est lié à une entreprise, et à une opportunité quand il y en a une.</text><text x="20" y="665" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="685" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un conflit d’horaire bloque-t-il, ou avertit-il seulement ?</text><text x="26" y="704" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Rappels : par quel canal (dans l’application, e-mail) et combien de temps avant ?</text><text x="26" y="723" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un rendez-vous peut-il avoir plusieurs participants internes (par exemple le Responsable commercial) ?</text>
</svg>