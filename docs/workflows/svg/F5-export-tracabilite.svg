<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 761" width="1640" height="761" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Export et traçabilité">
<title>F5 — Export et traçabilité</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1640" height="761" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Export et traçabilité</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Règle de la direction produit : qui voit exporte, dans sa portée, et chaque export est tracé. Réalisé pour la fiche entreprise.</text><text x="1620" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">F5 · Partiel</text>
<rect x="0" y="84" width="1640" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Utilisateur</text><rect x="0" y="212" width="1640" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text><rect x="0" y="340" width="1640" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="400.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Direction /</text><text x="78" y="415.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Sécurité</text>
<polyline points="348,148 361.5,148 361.5,276 375,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="531,276 553,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="453,230 453,148 616,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="631,322 631,404 736,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="709,276 914,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,374 809,276 914,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1060,276 1092,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1165,306 1165,404 1270,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1416,404 1506,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="202" y="118" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="275" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Demander un export</text><text x="275" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(fiche ou liste)</text><polygon points="453,230 531,276 453,322 375,276" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="280" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Dans sa portée ?</text><circle cx="631" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><text x="631" y="179" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">« Introuvable », aucune trace</text><circle cx="644" cy="135" r="10" fill="#b3541e"/><text x="644" y="139" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><polygon points="631,230 709,276 631,322 553,276" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="280" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Liste entière ?</text><circle cx="707" cy="232" r="10" fill="#b3541e"/><text x="707" y="236" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="736" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="394.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Confirmer le second</text><text x="809" y="408" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">facteur (étape</text><text x="809" y="421.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">renforcée)</text><rect x="914" y="246" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Enregistrer la trace</text><text x="987" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">avant la remise</text><circle cx="1058" cy="248" r="10" fill="#b3541e"/><text x="1058" y="252" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1092" y="246" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="266.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Remettre le document</text><text x="1165" y="280" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(seulement ce que</text><text x="1165" y="293.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">l’utilisateur voit)</text><rect x="1270" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Consulter le journal</text><text x="1343" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">d’audit</text><circle cx="1521" cy="404" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="539" y="270" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="461" y="222" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text><text x="639" y="338" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="717" y="270" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text>
<rect x="20" y="482" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="482" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,482 784,490 770,498 756,490" fill="#fff" stroke="#2f2c2a"/><text x="796" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="522" r="10" fill="#b3541e"/><text x="32" y="526" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="526" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Hors portée : même réponse qu’un identifiant inexistant (prévention d’IDOR) ; aucune trace n’est écrite.</text><circle cx="32" cy="545" r="10" fill="#b3541e"/><text x="32" y="549" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="549" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Option C (à confirmer) : confirmer le second facteur récemment avant un export de liste ; non réalisé.</text><circle cx="32" cy="568" r="10" fill="#b3541e"/><text x="32" y="572" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="52" y="572" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Trace : qui, session, adresse, appareil, document, ce qui a été remis (sans recopier les données). Si la trace échoue, rien n’est remis.</text><text x="20" y="605" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="625" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Direction (DG, DGA) : voit et exporte tout avec la portée « Tous » ; le DAF exporte ses documents financiers ; le chargé de compte, ses propres entreprises.</text><text x="26" y="644" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Les vues partagées (rapports des employés, agendas) suivent une règle d’audience, à définir.</text><text x="20" y="673" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="693" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Alerte automatique en cas d’export massif ou inhabituel ?</text><text x="26" y="712" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• PDF produit par le serveur plutôt qu’imprimé par le navigateur (ajout d’une bibliothèque).</text>
</svg>