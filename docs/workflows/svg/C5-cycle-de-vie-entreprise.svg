<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1462 738" width="1462" height="738" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Cycle de vie d’une entreprise (statuts)">
<title>C5 — Cycle de vie d’une entreprise (statuts)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1462" height="738" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Cycle de vie d’une entreprise (statuts)</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Cible → Contactée → Qualifiée → Cliente, et Archivée. Les statuts existent ; les transitions sont à décider.</text><text x="1442" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">C5 · Partiel</text>
<rect x="0" y="84" width="1462" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="212" width="1462" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="272.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Responsable</text><text x="78" y="287.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">commercial</text><rect x="0" y="340" width="1462" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="408" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text>
<polyline points="275,374 275,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="526,148 558,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="631,178 631,404 736,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,374 809,276 914,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,306 987,404 1092,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1238,404 1328,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="202" y="374" width="146" height="60" rx="28" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="275" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Création : statut «</text><text x="275" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Cible »</text><text x="216" y="378" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="380" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Premier contact établi</text><text x="453" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">: « Contactée »</text><rect x="558" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Besoin confirmé et RDV</text><text x="631" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">tenu : « Qualifiée »</text><circle cx="702" cy="120" r="10" fill="#b3541e"/><text x="702" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="736" y="374" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Agrément reçu : «</text><text x="809" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Cliente »</text><text x="750" y="378" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><circle cx="880" cy="376" r="10" fill="#b3541e"/><text x="880" y="380" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="914" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Archiver (motif,</text><text x="987" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">confirmation)</text><rect x="1092" y="374" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Entreprise archivée :</text><text x="1165" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">lecture seule</text><text x="1106" y="378" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><circle cx="1343" cy="404" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>

<rect x="20" y="482" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="482" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,482 784,490 770,498 756,490" fill="#fff" stroke="#2f2c2a"/><text x="796" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="522" r="10" fill="#b3541e"/><text x="32" y="526" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="526" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Critères de qualification à définir avec la direction commerciale.</text><circle cx="32" cy="545" r="10" fill="#b3541e"/><text x="32" y="549" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="549" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Transition automatique proposée ; à confirmer.</text><text x="20" y="582" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="602" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Cinq statuts existent dans l’application : Cible, Contactée, Qualifiée, Cliente, Archivée.</text><text x="26" y="621" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Une entreprise archivée ne se modifie plus ; elle reste exportable par ceux qui la voyaient.</text><text x="20" y="650" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="670" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Chaque changement de statut est-il manuel, automatique, ou mixte ?</text><text x="26" y="689" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Retour en arrière autorisé (par exemple Qualifiée → Contactée) ? Restauration d’une entreprise archivée ?</text>
</svg>