<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1818 1074" width="1818" height="1074" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Commission du facilitateur">
<title>F3 — Commission du facilitateur</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1818" height="1074" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Commission du facilitateur</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Mise en relation → commission définie → affaire conclue → fonds débloqués par le DAF → versement par le chargé de compte → justificatif.</text><text x="1798" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">F3 · Partiel</text>
<rect x="0" y="84" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="212" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="272.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Responsable</text><text x="78" y="287.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">commercial</text><rect x="0" y="340" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="408" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text><rect x="0" y="468" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="468" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="536" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">DAF (Finance)</text><rect x="0" y="596" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="596" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="656.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Facilitateur</text><text x="78" y="671.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">(externe)</text>
<polyline points="290,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="453,178 453,246" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="453,306 453,404 558,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="631,434 631,532 731,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,486 809,148 914,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="887,532 914,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><polyline points="987,178 987,660 1092,660" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1165,630 1165,148 1270,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1343,178 1343,532 1448,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,532 1684,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="275" cy="148" r="15" fill="#fff" stroke="#2f2c2a" stroke-width="2"/><rect x="380" y="118" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Créer l’entreprise avec</text><text x="453" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">son facilitateur</text><circle cx="524" cy="120" r="10" fill="#b3541e"/><text x="524" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="380" y="246" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Définir la commission</text><text x="453" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(fixe ou %)</text><circle cx="524" cy="248" r="10" fill="#b3541e"/><text x="524" y="252" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="558" y="374" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Affaire conclue :</text><text x="631" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">commission due</text><text x="572" y="378" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><circle cx="702" cy="376" r="10" fill="#b3541e"/><text x="702" y="380" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><polygon points="809,486 887,532 809,578 731,532" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="529.25" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Débloquer les</text><text x="809" y="542.75" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">fonds ?</text><rect x="914" y="502" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="529.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Mettre en attente avec</text><text x="987" y="542.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">motif</text><rect x="914" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Verser la commission au</text><text x="987" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">facilitateur</text><rect x="1092" y="630" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1165" y="664" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Reçoit le versement</text><rect x="1270" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Déposer le justificatif</text><text x="1343" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(reçu, ordre de</text><text x="1343" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">versement)</text><rect x="1448" y="502" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="536" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Contrôler et clôturer</text><circle cx="1699" cy="532" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="817" y="478" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="895" y="526" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text>
<rect x="20" y="738" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="750" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="738" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="750" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="738" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="750" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="738" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="750" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,738 784,746 770,754 756,746" fill="#fff" stroke="#2f2c2a"/><text x="796" y="750" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="778" r="10" fill="#b3541e"/><text x="32" y="782" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="782" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Le chargé de compte voit la commission de ses entreprises mais ne la définit pas.</text><circle cx="32" cy="801" r="10" fill="#b3541e"/><text x="32" y="805" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="805" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Seuls le Responsable commercial et le Super administrateur définissent, changent ou retirent une commission ; devise par défaut : FCFA (XAF).</text><circle cx="32" cy="824" r="10" fill="#b3541e"/><text x="32" y="828" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="52" y="828" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Déclencheur à décider : agrément reçu, agrément honoré, ou paiement du client encaissé.</text><text x="20" y="861" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="881" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• La commission est un texte décimal exact (montant fixe en XAF par défaut, ou pourcentage de 0 exclu à 100) ; la base refuse toute incohérence.</text><text x="26" y="900" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le facilitateur est une fiche réutilisable ; sa commission est propre à chaque affaire.</text><text x="26" y="919" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Chaque étape du versement est tracée dans l’audit (qui, quelle session).</text><text x="20" y="948" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="968" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Quel événement rend la commission « due » ?</text><text x="26" y="987" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Qui change l’état « fonds débloqués » : seulement le DAF, ou aussi le Responsable commercial ?</text><text x="26" y="1006" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Quel document : ordre de versement, reçu, ou les deux ? Un plafond ou une double validation au-delà d’un montant ?</text><text x="26" y="1025" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Une commission peut-elle être modifiée après le déblocage des fonds ?</text>
</svg>