<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1818 780" width="1818" height="780" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Opportunité : du pipeline à la clôture">
<title>C4 — Opportunité : du pipeline à la clôture</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1818" height="780" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Opportunité : du pipeline à la clôture</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Créer → proposer → négocier → accord de principe (flux F1) ou clôture perdue. Suivi par le Responsable commercial. Sprint S4.3.</text><text x="1798" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">C4 · À venir</text>
<rect x="0" y="84" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="212" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="272.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Responsable</text><text x="78" y="287.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">commercial</text><rect x="0" y="340" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="408" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text>
<polyline points="290,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="526,148 558,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="704,148 736,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="882,148 909,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,194 987,276 1092,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1065,148 1270,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1343,178 1343,404 1448,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,404 1684,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="275" cy="148" r="15" fill="#fff" stroke="#2f2c2a" stroke-width="2"/><rect x="380" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Créer l’opportunité («</text><text x="453" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Qualification »)</text><rect x="558" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Passer en « Proposition</text><text x="631" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">» (offre déposée)</text><circle cx="702" cy="120" r="10" fill="#b3541e"/><text x="702" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="736" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Passer en « Négociation</text><text x="809" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">» (RDV, visite)</text><polygon points="987,102 1065,148 987,194 909,148" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="152" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Issue ?</text><rect x="1092" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="266.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Clore « gagnée » ;</text><text x="1165" y="280" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">accord de principe et</text><text x="1165" y="293.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">agrément (voir flux F1)</text><circle cx="1236" cy="248" r="10" fill="#b3541e"/><text x="1236" y="252" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="1270" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Clore « perdue » avec</text><text x="1343" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">motif (confirmation)</text><circle cx="1414" cy="120" r="10" fill="#b3541e"/><text x="1414" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1448" y="374" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Opportunité clôturée :</text><text x="1521" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">immuable, tracée</text><text x="1462" y="378" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><circle cx="1699" cy="404" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="995" y="210" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Gagnée</text><text x="1073" y="142" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Perdue</text>
<rect x="20" y="482" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="482" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,482 784,490 770,498 756,490" fill="#fff" stroke="#2f2c2a"/><text x="796" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="522" r="10" fill="#b3541e"/><text x="32" y="526" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="526" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Les noms et l’ordre des étapes sont ceux du prototype ; à valider.</text><circle cx="32" cy="545" r="10" fill="#b3541e"/><text x="32" y="549" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="549" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Décision D28 : seul le Responsable commercial clôt une opportunité gagnée, car elle déclenche l’agrément et la commission.</text><circle cx="32" cy="568" r="10" fill="#b3541e"/><text x="32" y="572" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="52" y="572" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Décision D28 : le chargé de compte clôt lui-même ses opportunités perdues (permission à créer : bd.opportunity.close_lost).</text><text x="20" y="605" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="625" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Étapes franchies dans l’ordre ; chaque passage est tracé ; modification concurrente refusée.</text><text x="26" y="644" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Plusieurs opportunités peuvent coexister pour une même entreprise.</text><text x="26" y="663" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• La vue « Par étape » a une alternative clavier ; la sélection est persistante.</text><text x="20" y="692" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="712" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Motifs de perte : liste fermée ou texte libre ? Une opportunité clôturée peut-elle être rouverte (exception auditée) ?</text><text x="26" y="731" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Retour en arrière d’une étape : permis, avec justification ?</text>
</svg>