<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1818 946" width="1818" height="946" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Du besoin à l’agrément">
<title>F1 — Du besoin à l’agrément</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1818" height="946" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Du besoin à l’agrément</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Opportunité commerciale → accord de principe → agrément (promesse de paiement). Sprints S4.3 et S4.4.</text><text x="1798" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">F1 · À venir</text>
<rect x="0" y="84" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Client (externe)</text><rect x="0" y="212" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="340" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="400.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Responsable</text><text x="78" y="415.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">commercial</text><rect x="0" y="468" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="468" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="536" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text>
<polyline points="290,276 380,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="526,276 558,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="704,276 731,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,230 809,148 914,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,322 809,374" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1060,148 1076,148 1076,276 1092,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="882,404 898,404 898,148 914,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1238,276 1254,276 1254,148 1270,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1416,148 1432,148 1432,276 1448,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1521,306 1521,502" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,532 1684,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="275" cy="276" r="15" fill="#fff" stroke="#2f2c2a" stroke-width="2"/><rect x="380" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="280" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Qualifier l’opportunité</text><rect x="558" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Tenir un rendez-vous</text><text x="631" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">décideur</text><polygon points="809,230 887,276 809,322 731,276" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="273.25" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">RDV décideur tenu</text><text x="809" y="286.75" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">?</text><circle cx="885" cy="232" r="10" fill="#b3541e"/><text x="885" y="236" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="914" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="987" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Donne son accord de</text><text x="987" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">principe</text><rect x="736" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Accorder une dérogation</text><text x="809" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">motivée</text><circle cx="880" cy="376" r="10" fill="#b3541e"/><text x="880" y="380" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="1092" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Demander l’agrément et</text><text x="1165" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">le document signé</text><rect x="1270" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1343" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Remet l’agrément signé</text><rect x="1448" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="266.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Enregistrer l’agrément</text><text x="1521" y="280" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(montant, payeur,</text><text x="1521" y="293.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">validité)</text><circle cx="1592" cy="248" r="10" fill="#b3541e"/><text x="1592" y="252" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1448" y="502" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="522.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Agrément accordé :</text><text x="1521" y="536" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">événement vers</text><text x="1521" y="549.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Investudy</text><text x="1462" y="506" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><circle cx="1699" cy="532" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="817" y="222" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="817" y="338" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text>
<rect x="20" y="610" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="610" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,610 784,618 770,626 756,618" fill="#fff" stroke="#2f2c2a"/><text x="796" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="650" r="10" fill="#b3541e"/><text x="32" y="654" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="654" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Règle active : pas d’accord de principe sans au moins un rendez-vous décideur tenu.</text><circle cx="32" cy="673" r="10" fill="#b3541e"/><text x="32" y="677" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="677" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Dérogation réservée au Responsable commercial ; justification obligatoire, action confirmée et inscrite dans l’audit.</text><circle cx="32" cy="696" r="10" fill="#b3541e"/><text x="32" y="700" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="52" y="700" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Agrément = promesse de paiement, détenu par Business Development. Montant &gt; 0 en XAF par défaut, document signé joint, période de validité.</text><text x="20" y="733" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="753" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Une entreprise peut avoir plusieurs opportunités simultanées ; une opportunité clôturée est immuable.</text><text x="26" y="772" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Les étapes se franchissent dans l’ordre défini ; chaque passage est tracé.</text><text x="26" y="791" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• États de l’agrément : demandé → reçu → honoré, ou expiré / annulé.</text><text x="20" y="820" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="840" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• L’agrément couvre-t-il un nombre de places, une somme globale, ou les deux ?</text><text x="26" y="859" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• L’agrément peut-il être émis par un tiers (employeur, bailleur, organisme) ?</text><text x="26" y="878" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Quelle règle d’expiration, et que devient une inscription déjà faite si l’agrément est annulé ?</text><text x="26" y="897" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le paiement effectif est-il suivi par le CRM, ou seulement par la Finance (défaut retenu : la Finance) ?</text>
</svg>