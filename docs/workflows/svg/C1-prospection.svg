<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1818 927" width="1818" height="927" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Prospection : de l’entreprise cible au premier contact">
<title>C1 — Prospection : de l’entreprise cible au premier contact</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1818" height="927" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Prospection : de l’entreprise cible au premier contact</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Enregistrer l’entreprise (avec son facilitateur) → prendre contact → contact créé → entreprise « Contactée » ou archivée.</text><text x="1798" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">C1 · Partiel</text>
<rect x="0" y="84" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="212" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text><rect x="0" y="340" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="400.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Facilitateur</text><text x="78" y="415.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">(externe)</text><rect x="0" y="468" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="468" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="528.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Entreprise</text><text x="78" y="543.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">(externe)</text>
<polyline points="290,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="453,178 453,276 553,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="709,276 751.5,276 751.5,148 794,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="631,230 631,276 736,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,306 809,404 914,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,374 987,178" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,178 987,532 1092,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1165,502 1165,148 1265,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1421,148 1448,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1343,194 1343,276 1448,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,148 1684,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,276 1684,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="275" cy="148" r="15" fill="#fff" stroke="#2f2c2a" stroke-width="2"/><rect x="380" y="118" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="131.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Enregistrer</text><text x="453" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">l’entreprise cible</text><text x="453" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(coordonnées, pays,</text><text x="453" y="172.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">facilitateur)</text><polygon points="631,230 709,276 631,322 553,276" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="280" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Nom déjà pris ?</text><circle cx="707" cy="232" r="10" fill="#b3541e"/><text x="707" y="236" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="809" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><text x="809" y="179" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">Conflit : fiche existante proposée</text><rect x="736" y="246" width="146" height="60" rx="28" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Entreprise créée au</text><text x="809" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">statut « Cible »</text><text x="750" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="914" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="987" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Met en relation avec</text><text x="987" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">l’entreprise</text><rect x="914" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Prendre contact</text><text x="987" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(WhatsApp, appel,</text><text x="987" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">e-mail, rencontre)</text><rect x="1092" y="502" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1165" y="536" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Répond</text><polygon points="1343,102 1421,148 1343,194 1265,148" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="152" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Intérêt exprimé ?</text><rect x="1448" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Créer le contact,</text><text x="1521" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">passer l’entreprise en</text><text x="1521" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">« Contactée »</text><circle cx="1592" cy="120" r="10" fill="#b3541e"/><text x="1592" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="1448" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Archiver avec motif</text><text x="1521" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(confirmation)</text><circle cx="1592" cy="248" r="10" fill="#b3541e"/><text x="1592" y="252" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="1699" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><circle cx="1699" cy="276" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="717" y="270" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="639" y="246" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text><text x="1429" y="142" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="1351" y="210" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text>
<rect x="20" y="610" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="610" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,610 784,618 770,626 756,618" fill="#fff" stroke="#2f2c2a"/><text x="796" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="650" r="10" fill="#b3541e"/><text x="32" y="654" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="654" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Unicité du nom sans tenir compte de la casse ni des espaces ; le chargé de compte est invité à ouvrir la fiche existante.</text><circle cx="32" cy="673" r="10" fill="#b3541e"/><text x="32" y="677" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="677" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Le passage de statut est-il manuel ou automatique à la création du premier contact ? À trancher.</text><circle cx="32" cy="696" r="10" fill="#b3541e"/><text x="32" y="700" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="52" y="700" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Seul le Responsable commercial archive aujourd’hui : le chargé de compte n’a pas ce droit.</text><text x="20" y="733" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="753" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Une entreprise appartient à son créateur ; le propriétaire ne change pas en modifiant la fiche.</text><text x="26" y="772" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le facilitateur est une fiche réutilisable ; la méthode de prise de contact et la commission sont propres à chaque entreprise.</text><text x="26" y="791" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Une entreprise archivée n’est plus modifiable.</text><text x="20" y="820" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="840" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Statut : le passage « Cible → Contactée » est-il manuel ou déclenché par la création d’un contact ou d’une première action ?</text><text x="26" y="859" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le chargé de compte peut-il archiver ses propres entreprises, ou seulement le Responsable commercial ?</text><text x="26" y="878" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un motif d’archivage obligatoire, et une restauration possible ?</text>
</svg>