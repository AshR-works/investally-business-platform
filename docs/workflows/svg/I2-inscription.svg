<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1818 976" width="1818" height="976" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Inscription d’un apprenant à une session">
<title>I2 — Inscription d’un apprenant à une session</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1818" height="976" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Inscription d’un apprenant à une session</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Choisir session et apprenant → rattacher à l’agrément → contrôles → confirmation par Investudy → la Finance est prévenue. Sprint S5.2.</text><text x="1798" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">I2 · À venir</text>
<rect x="0" y="84" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="212" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text><rect x="0" y="340" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="400.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Responsable</text><text x="78" y="415.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Investudy</text><rect x="0" y="468" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="468" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="536" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Finance (ERP)</text>
<polyline points="290,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="526,148 558,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="704,148 717.5,148 717.5,276 731,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,230 809,148 972,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="887,276 914,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1060,276 1076,276 1076,404 1092,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1238,404 1254,404 1254,276 1270,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1416,276 1432,276 1432,532 1448,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,532 1684,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="275" cy="148" r="15" fill="#fff" stroke="#2f2c2a" stroke-width="2"/><rect x="380" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Choisir la session</text><text x="453" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">ouverte et l’apprenant</text><text x="453" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(fiche créée au besoin)</text><circle cx="524" cy="120" r="10" fill="#b3541e"/><text x="524" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="558" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Rattacher l’inscription</text><text x="631" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">à l’agrément de</text><text x="631" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">l’entreprise</text><polygon points="809,230 887,276 809,322 731,276" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="273.25" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Contrôles réussis</text><text x="809" y="286.75" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">?</text><circle cx="885" cy="232" r="10" fill="#b3541e"/><text x="885" y="236" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="987" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><text x="987" y="179" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">Refus motivé (agrément, capacité ou doublon)</text><rect x="914" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Inscription « En</text><text x="987" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">attente »</text><text x="928" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="1092" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="394.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Consulter les</text><text x="1165" y="408" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">inscriptions en attente</text><text x="1165" y="421.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">et confirmer</text><circle cx="1236" cy="376" r="10" fill="#b3541e"/><text x="1236" y="380" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1270" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Inscription « Confirmée</text><text x="1343" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">» ; place décomptée</text><text x="1284" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="1448" y="502" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1521" y="522.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Reçoit l’événement et</text><text x="1521" y="536" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">prépare la demande de</text><text x="1521" y="549.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">paiement (flux F3)</text><circle cx="1699" cy="532" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="817" y="222" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text><text x="895" y="270" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text>
<rect x="20" y="610" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="610" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,610 784,618 770,626 756,618" fill="#fff" stroke="#2f2c2a"/><text x="796" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="650" r="10" fill="#b3541e"/><text x="32" y="654" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="654" font-size="12" font-weight="400" fill="#262626" text-anchor="start">L’apprenant n’a ni compte ni accès : sa fiche est saisie par le personnel. Il est distinct du contact de l’entreprise, avec un lien facultatif</text><text x="52" y="669" font-size="12" font-weight="400" fill="#262626" text-anchor="start">(décision D7 à confirmer).</text><circle cx="32" cy="688" r="10" fill="#b3541e"/><text x="32" y="692" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="692" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Contrôles : agrément valide, cumul dans l’agrément, place libre, apprenant non déjà inscrit. Sans agrément valide : refus. Cumul des inscriptions</text><text x="52" y="707" font-size="12" font-weight="400" fill="#262626" text-anchor="start">supérieur à l’agrément : refus. Session complète : refus (liste d’attente à trancher).</text><circle cx="32" cy="726" r="10" fill="#b3541e"/><text x="32" y="730" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="52" y="730" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Qui confirme : le Responsable Investudy seul, ou aussi le chargé de compte ? À trancher.</text><text x="20" y="763" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="783" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Training garde une copie locale de l’agrément reçu par événement : l’inscription n’interroge jamais la base de Business Development.</text><text x="26" y="802" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Une inscription est attachée à un agrément, une session et un apprenant ; un apprenant ne s’inscrit qu’une fois à la même session.</text><text x="26" y="821" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un chargé de compte ne voit et n’inscrit que les apprenants de ses entreprises (droit « Propre »).</text><text x="26" y="840" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le paiement est suivi par la Finance : le statut « réglé » arrive par événement, il n’est jamais saisi dans le CRM.</text><text x="20" y="869" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="889" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Liste d’attente quand la session est complète : oui ou non, et promotion automatique ou manuelle ?</text><text x="26" y="908" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Qui confirme une inscription : le Responsable Investudy seul ?</text><text x="26" y="927" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un apprenant peut-il changer de session (transfert) sans repasser par une nouvelle inscription ?</text>
</svg>