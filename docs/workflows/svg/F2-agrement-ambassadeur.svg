<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1818 950" width="1818" height="950" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : De l’agrément à l’ambassadeur">
<title>F2 — De l’agrément à l’ambassadeur</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1818" height="950" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">De l’agrément à l’ambassadeur</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Inscription → session → présences et évaluations → certification → suggestion d’ambassadeur. Sprints S5.1 à S5.3 et S4.4.</text><text x="1798" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">F2 · À venir</text>
<rect x="0" y="84" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="212" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="272.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Responsable</text><text x="78" y="287.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Investudy</text><rect x="0" y="340" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="408" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Formateur</text><rect x="0" y="468" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="468" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="536" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text>
<polyline points="275,502 275,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="526,148 539.5,148 539.5,532 553,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="709,532 722.5,532 722.5,276 736,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="709,532 794,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="882,276 898,276 898,404 914,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1060,404 1076,404 1076,276 1092,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1238,276 1270,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1343,306 1343,502" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1416,532 1432,532 1432,148 1448,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,148 1684,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="202" y="502" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="275" y="522.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Agrément valide reçu</text><text x="275" y="536" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(de Business</text><text x="275" y="549.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Development)</text><text x="216" y="506" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="380" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Inscrire l’apprenant à</text><text x="453" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">une session</text><polygon points="631,486 709,532 631,578 553,532" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="529.25" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Agrément valide</text><text x="631" y="542.75" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">et place libre ?</text><circle cx="707" cy="488" r="10" fill="#b3541e"/><text x="707" y="492" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="809" cy="532" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><text x="809" y="563" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">Refus expliqué</text><rect x="736" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Confirmer l’inscription</text><text x="809" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(salle, formateur)</text><circle cx="880" cy="248" r="10" fill="#b3541e"/><text x="880" y="252" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="914" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="394.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Animer la session :</text><text x="987" y="408" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">présences et</text><text x="987" y="421.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">évaluations</text><rect x="1092" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="280" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Clôturer la session</text><circle cx="1236" cy="248" r="10" fill="#b3541e"/><text x="1236" y="252" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1270" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Délivrer certificat ou</text><text x="1343" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">attestation</text><rect x="1270" y="502" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="529.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Certification délivrée</text><text x="1343" y="542.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">: suggestion</text><text x="1284" y="506" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="1448" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Décider de créer un</text><text x="1521" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">ambassadeur</text><circle cx="1592" cy="120" r="10" fill="#b3541e"/><text x="1592" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="1699" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="717" y="526" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="717" y="526" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text>
<rect x="20" y="610" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="610" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,610 784,618 770,626 756,618" fill="#fff" stroke="#2f2c2a"/><text x="796" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="650" r="10" fill="#b3541e"/><text x="32" y="654" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="654" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Sans agrément valide, pas d’inscription ; le cumul des inscriptions ne dépasse pas l’agrément ; inscrits ≤ capacité.</text><circle cx="32" cy="673" r="10" fill="#b3541e"/><text x="32" y="677" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="677" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Pas de double réservation de salle ou de formateur sur un créneau.</text><circle cx="32" cy="696" r="10" fill="#b3541e"/><text x="32" y="700" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="52" y="700" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Session clôturée : présences figées.</text><circle cx="32" cy="719" r="10" fill="#b3541e"/><text x="32" y="723" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="52" y="723" font-size="12" font-weight="400" fill="#262626" text-anchor="start">La création est toujours manuelle ; la suggestion n’est qu’une tâche pour le chargé de compte.</text><text x="20" y="756" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="776" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• L’apprenant n’a ni compte ni accès à l’application : sa fiche est saisie par le personnel.</text><text x="26" y="795" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Agrément annulé ou expiré : les inscriptions non encore réglées sont signalées.</text><text x="26" y="814" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un apprenant s’inscrit une seule fois à une session.</text><text x="20" y="843" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="863" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Liste d’attente quand une session est complète : oui ou non ?</text><text x="26" y="882" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Qui confirme l’inscription : le chargé de compte, le Responsable Investudy, ou les deux ?</text><text x="26" y="901" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Quelle note ou quel taux de présence donne droit au certificat plutôt qu’à l’attestation ?</text>
</svg>