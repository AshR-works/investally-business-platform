<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1996 776" width="1996" height="776" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Déroulement d’une session : présences, évaluations, clôture">
<title>I3 — Déroulement d’une session : présences, évaluations, clôture</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1996" height="776" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Déroulement d’une session : présences, évaluations, clôture</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Cocher les présences chaque jour → saisir les évaluations → vérifier et clôturer : les présences sont figées. Sprint S5.3.</text><text x="1976" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">I3 · À venir</text>
<rect x="0" y="84" width="1996" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Formateur</text><rect x="0" y="212" width="1996" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text><rect x="0" y="340" width="1996" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="400.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Responsable</text><text x="78" y="415.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Investudy</text>
<polyline points="290,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="526,148 558,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="704,148 717.5,148 717.5,276 731,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,230 809,148 972,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="887,276 914,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1060,276 1076,276 1076,148 1092,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1238,148 1254,148 1254,404 1270,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1416,404 1443,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1599,404 1684,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1521,358 1521,276 1626,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1772,276 1817,276 1817,404 1862,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="275" cy="148" r="15" fill="#fff" stroke="#2f2c2a" stroke-width="2"/><rect x="380" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Ouvrir la feuille de</text><text x="453" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">présence du jour</text><circle cx="524" cy="120" r="10" fill="#b3541e"/><text x="524" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="558" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Cocher matin et</text><text x="631" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">après-midi, noter</text><text x="631" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">retards et observations</text><polygon points="809,230 887,276 809,322 731,276" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="273.25" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Session clôturée</text><text x="809" y="286.75" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">?</text><circle cx="987" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><text x="987" y="179" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">Saisie refusée : présences figées</text><rect x="914" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Présences enregistrées</text><text x="987" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">et tracées (qui, quand)</text><text x="928" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="1092" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Répéter chaque jour,</text><text x="1165" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">puis saisir les</text><text x="1165" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">évaluations</text><circle cx="1236" cy="120" r="10" fill="#b3541e"/><text x="1236" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="1270" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Vérifier présences et</text><text x="1343" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">évaluations saisies</text><polygon points="1521,358 1599,404 1521,450 1443,404" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="408" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Tout est saisi ?</text><circle cx="1699" cy="404" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><text x="1699" y="435" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">Relancer le formateur</text><rect x="1626" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1699" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Session « Clôturée » :</text><text x="1699" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">présences figées</text><text x="1640" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><circle cx="1877" cy="404" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><text x="1877" y="435" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">Certifications possibles</text>
<text x="817" y="222" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="895" y="270" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text><text x="1607" y="398" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text><text x="1529" y="350" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text>
<rect x="20" y="482" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="482" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,482 784,490 770,498 756,490" fill="#fff" stroke="#2f2c2a"/><text x="796" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="522" r="10" fill="#b3541e"/><text x="32" y="526" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="526" font-size="12" font-weight="400" fill="#262626" text-anchor="start">La feuille d’émargement papier est un document de la charte graphique, imprimable depuis la même page.</text><circle cx="32" cy="545" r="10" fill="#b3541e"/><text x="32" y="549" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="549" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Un apprenant absent excusé ou non : la différence est notée dans l’observation ; les seuils de présence sont à trancher.</text><text x="20" y="582" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="602" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le formateur ne saisit que pour ses sessions ; le Responsable Investudy peut corriger avant la clôture, avec trace.</text><text x="26" y="621" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Après la clôture : aucune présence ni évaluation ne change ; une correction exceptionnelle demande une réouverture tracée (à trancher).</text><text x="26" y="640" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Chaque présence enregistrée garde son auteur, la date et l’ancienne valeur (audit).</text><text x="20" y="669" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="689" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Réouverture exceptionnelle d’une session clôturée : permise, par qui, avec quelle justification ?</text><text x="26" y="708" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Barème des évaluations : note sur 20, acquis ou non acquis, ou compétences ?</text><text x="26" y="727" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Absences : excusée ou non excusée, avec justificatif joint ?</text>
</svg>