<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1818 946" width="1818" height="946" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Du catalogue à la session ouverte">
<title>I1 — Du catalogue à la session ouverte</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1818" height="946" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Du catalogue à la session ouverte</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Créer le programme et la formation → planifier une session (dates, salle, formateur, capacité) → ouvrir les inscriptions. Sprints S5.1 et S5.2.</text><text x="1798" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">I1 · À venir</text>
<rect x="0" y="84" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="144.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Responsable</text><text x="78" y="159.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Investudy</text><rect x="0" y="212" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text><rect x="0" y="340" width="1818" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="408" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Formateur</text><rect x="0" y="468" width="1818" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="468" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="536" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text>
<polyline points="290,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="526,148 558,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="704,148 717.5,148 717.5,276 731,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,230 809,148 972,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="887,276 914,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1060,276 1076,276 1076,148 1092,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,306 987,404 1092,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1238,148 1254,148 1254,276 1270,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1416,276 1432,276 1432,532 1448,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,532 1684,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="275" cy="148" r="15" fill="#fff" stroke="#2f2c2a" stroke-width="2"/><rect x="380" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Créer le programme et</text><text x="453" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">la formation (durée,</text><text x="453" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">contenu, tarif)</text><circle cx="524" cy="120" r="10" fill="#b3541e"/><text x="524" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="558" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Planifier une session :</text><text x="631" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">dates, salle,</text><text x="631" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">formateur, capacité</text><polygon points="809,230 887,276 809,322 731,276" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="266.5" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Salle ou</text><text x="809" y="280" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">formateur déjà</text><text x="809" y="293.5" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">pris ?</text><circle cx="885" cy="232" r="10" fill="#b3541e"/><text x="885" y="236" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="987" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><text x="987" y="179" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">Conflit : choisir un autre créneau</text><rect x="914" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Session créée à l’état</text><text x="987" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">« Planifiée »</text><text x="928" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="1092" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Ouvrir les inscriptions</text><circle cx="1236" cy="120" r="10" fill="#b3541e"/><text x="1236" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1092" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Voit la session dans «</text><text x="1165" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">ses sessions »</text><rect x="1270" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Session « Ouverte » :</text><text x="1343" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">inscriptions possibles</text><text x="1284" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="1448" y="502" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="522.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Consulte les sessions</text><text x="1521" y="536" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">ouvertes et les places</text><text x="1521" y="549.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">restantes</text><circle cx="1699" cy="532" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="817" y="222" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="895" y="270" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text>
<rect x="20" y="610" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="610" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,610 784,618 770,626 756,618" fill="#fff" stroke="#2f2c2a"/><text x="796" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="650" r="10" fill="#b3541e"/><text x="32" y="654" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="654" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Un programme se décline en formations ; une formation se planifie en sessions. Un programme archivé n’accepte plus de nouvelle session.</text><circle cx="32" cy="673" r="10" fill="#b3541e"/><text x="32" y="677" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="677" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Aucune double réservation : la salle et le formateur ne peuvent pas être sur deux sessions qui se chevauchent.</text><circle cx="32" cy="696" r="10" fill="#b3541e"/><text x="32" y="700" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="52" y="700" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Tant qu’une session est « Planifiée », elle n’est pas proposée aux chargés de compte.</text><text x="20" y="733" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="753" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Seul le Responsable Investudy (et le Super administrateur) crée et modifie programmes, formations, sessions, salles et formateurs.</text><text x="26" y="772" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un formateur ne voit que ses propres sessions (droit « Propre »).</text><text x="26" y="791" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Une session a des dates, une capacité positive, une salle et un formateur ; modification concurrente refusée (version lue).</text><text x="26" y="810" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Une session déjà commencée ne change plus de salle ni de formateur sans trace et confirmation.</text><text x="20" y="839" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="859" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Un programme est-il une famille de formations (« Analyse financière ») ou une formation unique ? Le prototype montre « programme → formations ».</text><text x="26" y="878" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Prérequis d’une formation et niveaux (N1, N2) : simple texte, ou règle contrôlée à l’inscription ?</text><text x="26" y="897" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Plusieurs formateurs ou plusieurs salles pour une même session ? (une seule de chaque dans la première version)</text>
</svg>