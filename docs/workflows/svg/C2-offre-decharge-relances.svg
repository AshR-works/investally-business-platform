<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1462 799" width="1462" height="799" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Offre, décharge et relances">
<title>C2 — Offre, décharge et relances</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1462" height="799" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Offre, décharge et relances</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Déposer une offre → obtenir la décharge signée, sinon relancer → offre acceptée, refusée ou retirée. Sprint S4.2.</text><text x="1442" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">C2 · À venir</text>
<rect x="0" y="84" width="1462" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="152" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="212" width="1462" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="272.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Entreprise</text><text x="78" y="287.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">(externe)</text><rect x="0" y="340" width="1462" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="408" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text>
<polyline points="290,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="526,148 558,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="631,178 631,276 914,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="631,178 631,404 736,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,246 987,148 1092,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1238,148 1328,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="809,374 809,178" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="275" cy="148" r="15" fill="#fff" stroke="#2f2c2a" stroke-width="2"/><rect x="380" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Préparer l’offre</text><text x="453" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(entreprise,</text><text x="453" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">opportunité, montant)</text><rect x="558" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Déposer l’offre chez</text><text x="631" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">l’entreprise</text><rect x="914" y="246" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="987" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Reçoit l’offre et signe</text><text x="987" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">la décharge</text><rect x="1092" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Enregistrer la décharge</text><text x="1165" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(document signé)</text><circle cx="1236" cy="120" r="10" fill="#b3541e"/><text x="1236" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="1343" cy="148" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><rect x="736" y="374" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Relance planifiée à</text><text x="809" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">l’échéance</text><text x="750" y="378" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><circle cx="880" cy="376" r="10" fill="#b3541e"/><text x="880" y="380" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="736" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Relancer (appel,</text><text x="809" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">e-mail, WhatsApp) et</text><text x="809" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">noter le résultat</text><circle cx="880" cy="120" r="10" fill="#b3541e"/><text x="880" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text>

<rect x="20" y="482" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="482" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,482 784,490 770,498 756,490" fill="#fff" stroke="#2f2c2a"/><text x="796" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="522" r="10" fill="#b3541e"/><text x="32" y="526" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="526" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Une seule décharge valide par offre ; l’offre passe « Décharge reçue ».</text><circle cx="32" cy="545" r="10" fill="#b3541e"/><text x="32" y="549" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="549" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Les relances n’existent plus après une décharge refusée ou une offre retirée ; le retrait de l’offre annule les relances (confirmation).</text><circle cx="32" cy="568" r="10" fill="#b3541e"/><text x="32" y="572" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="52" y="572" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Après la relance : la décharge arrive (étape « Enregistrer la décharge ») ou l’offre est retirée.</text><text x="20" y="605" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="625" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Statut d’une offre limité aux transitions permises ; modification concurrente refusée (verrou optimiste).</text><text x="26" y="644" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le dépôt de la décharge réutilise les documents (versions, empreinte, contrôle du contenu).</text><text x="26" y="663" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Une relance en retard remonte dans « À faire » et dans l’agenda.</text><text x="20" y="692" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="712" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• États exacts d’une offre : brouillon, déposée, décharge reçue, acceptée, refusée, retirée ?</text><text x="26" y="731" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Délai de relance par défaut après le dépôt, et nombre maximum de relances ?</text><text x="26" y="750" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Une offre refusée par le client est-elle distincte d’une offre retirée par Investally ?</text>
</svg>