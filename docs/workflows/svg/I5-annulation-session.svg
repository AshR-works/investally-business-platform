<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1996 862" width="1996" height="862" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Annulation ou report d’une session">
<title>I5 — Annulation ou report d’une session</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1996" height="862" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Annulation ou report d’une session</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Décider l’annulation (ou le report) → les inscrits sont signalés → le chargé de compte replace ou annule → la Finance ajuste. Sprint S5.2.</text><text x="1976" y="32" font-size="12" font-weight="700" fill="#b3541e" text-anchor="end">I5 · À venir</text>
<rect x="0" y="84" width="1996" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="144.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Responsable</text><text x="78" y="159.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Investudy</text><rect x="0" y="212" width="1996" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text><rect x="0" y="340" width="1996" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="408" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Chargé de compte</text><rect x="0" y="468" width="1996" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="468" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="536" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Finance (ERP)</text>
<polyline points="290,148 380,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="526,148 558,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="704,148 720,148 720,276 736,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="882,276 914,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,306 987,404 1092,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1238,404 1265,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1421,404 1448,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1343,358 1343,276 1448,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,404 1684,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1594,276 1610,276 1610,532 1626,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1772,532 1862,532" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="275" cy="148" r="15" fill="#fff" stroke="#2f2c2a" stroke-width="2"/><rect x="380" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Décider l’annulation ou</text><text x="453" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">le report avec le motif</text><rect x="558" y="118" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Confirmer l’action</text><text x="631" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(confirmation à</text><text x="631" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">l’écran)</text><circle cx="702" cy="120" r="10" fill="#b3541e"/><text x="702" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="736" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Session « Annulée » ou</text><text x="809" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">dates modifiées</text><text x="750" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="914" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Inscriptions passées à</text><text x="987" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">« À replacer »</text><text x="928" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="1092" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="394.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Est notifié, prévient</text><text x="1165" y="408" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">l’entreprise et choisit</text><text x="1165" y="421.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">une autre session</text><polygon points="1343,358 1421,404 1343,450 1265,404" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="401.25" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">Replacer sur une</text><text x="1343" y="414.75" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">autre session ?</text><rect x="1448" y="374" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Nouvelle inscription</text><text x="1521" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(flux I2)</text><rect x="1448" y="246" width="146" height="60" rx="28" fill="#fff" stroke="#2f2c2a" stroke-width="1.6"/><text x="1521" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Inscription annulée ;</text><text x="1521" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Finance notifiée</text><text x="1462" y="250" font-size="12" font-weight="400" fill="#262626" text-anchor="middle">⚡</text><rect x="1626" y="502" width="146" height="60" rx="9" fill="#fff" stroke="#2f2c2a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1699" y="529.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Annule ou ajuste la</text><text x="1699" y="542.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">demande de paiement</text><circle cx="1699" cy="404" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/><circle cx="1877" cy="532" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>
<text x="1429" y="398" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Oui</text><text x="1351" y="350" font-size="11" font-weight="700" fill="#2f2c2a" stroke="#fff" stroke-width="3" paint-order="stroke">Non</text>
<rect x="20" y="610" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="610" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="610" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,610 784,618 770,626 756,618" fill="#fff" stroke="#2f2c2a"/><text x="796" y="622" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="650" r="10" fill="#b3541e"/><text x="32" y="654" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="654" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Action confirmée et tracée ; une session déjà clôturée ne peut pas être annulée.</text><text x="20" y="687" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="707" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• L’annulation d’une session ne supprime aucune inscription : elles restent visibles avec leur nouvel état.</text><text x="26" y="726" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• L’agrément n’est pas consommé par une inscription annulée.</text><text x="26" y="745" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le replacement d’un inscrit sur une autre session suit les mêmes contrôles qu’une inscription (flux I2).</text><text x="20" y="774" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="794" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Délai minimum avant la session pour annuler sans pénalité ; remboursement ou avoir (décision de la Finance).</text><text x="26" y="813" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le report d’une session est-il une annulation suivie d’une nouvelle session, ou une simple modification de dates avec conservation des inscrits ?</text>
</svg>