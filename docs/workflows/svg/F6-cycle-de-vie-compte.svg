<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 742" width="1640" height="742" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Workflow : Cycle de vie d’un compte">
<title>F6 — Cycle de vie d’un compte</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1640" height="742" fill="#ffffff"/>
<text x="20" y="32" font-size="21" font-weight="700" fill="#262626" text-anchor="start">Cycle de vie d’un compte</text><text x="20" y="54" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Invitation → activation → second facteur → connexion → évolution des droits → désactivation. Accès et sécurité (S3).</text><text x="1620" y="32" font-size="12" font-weight="700" fill="#2e7d32" text-anchor="end">F6 · Réalisé</text>
<rect x="0" y="84" width="1640" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="84" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="144.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Super</text><text x="78" y="159.5" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">administrateur</text><rect x="0" y="212" width="1640" height="128" fill="#fafafa" stroke="#c9c9c9"/><rect x="0" y="212" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="280" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Système</text><rect x="0" y="340" width="1640" height="128" fill="#f3f3f3" stroke="#c9c9c9"/><rect x="0" y="340" width="156" height="128" fill="#e9e9e9" stroke="#c9c9c9"/><text x="78" y="408" font-size="12" font-weight="700" fill="#262626" text-anchor="middle">Utilisateur</text>
<polyline points="275,178 275,276 380,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="453,306 453,404 558,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="704,404 736,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="882,404 914,404" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="987,374 987,148 1092,148" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1165,178 1165,276 1270,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1416,276 1506,276" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="202" y="118" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="275" y="145.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Inviter l’utilisateur</text><text x="275" y="158.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">avec ses rôles</text><circle cx="346" cy="120" r="10" fill="#b3541e"/><text x="346" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="380" y="246" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="453" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Envoyer le lien</text><text x="453" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">d’invitation</text><rect x="558" y="374" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="631" y="394.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Activer le compte</text><text x="631" y="408" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">(choisir un mot de</text><text x="631" y="421.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">passe)</text><rect x="736" y="374" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="809" y="394.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Enrôler le second</text><text x="809" y="408" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">facteur (QR, codes de</text><text x="809" y="421.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">secours)</text><circle cx="880" cy="376" r="10" fill="#b3541e"/><text x="880" y="380" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="914" y="374" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="987" y="401.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Se connecter (mot de</text><text x="987" y="414.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">passe et code)</text><rect x="1092" y="118" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="1165" y="138.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Modifier les rôles,</text><text x="1165" y="152" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">désactiver,</text><text x="1165" y="165.5" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">réinitialiser</text><circle cx="1236" cy="120" r="10" fill="#b3541e"/><text x="1236" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1270" y="246" width="146" height="60" rx="9" fill="#e2e2e2" stroke="#2f2c2a" stroke-width="1.6"/><text x="1343" y="273.25" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">Journaliser et révoquer</text><text x="1343" y="286.75" font-size="11.5" font-weight="500" fill="#262626" text-anchor="middle">les sessions concernées</text><circle cx="1521" cy="276" r="15" fill="#2f2c2a" stroke="#2f2c2a" stroke-width="2"/>

<rect x="20" y="482" width="24" height="16" rx="5" fill="#e2e2e2" stroke="#2f2c2a"/><text x="52" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Déjà réalisé dans l’application</text><rect x="260" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a"/><text x="292" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">À venir</text><rect x="360" y="482" width="24" height="16" rx="5" fill="#fff" stroke="#2f2c2a" stroke-dasharray="5 3"/><text x="392" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Acteur ou action externe</text><rect x="560" y="482" width="26" height="16" rx="8" fill="#fff" stroke="#2f2c2a"/><text x="594" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">⚡ Événement automatique</text><polygon points="770,482 784,490 770,498 756,490" fill="#fff" stroke="#2f2c2a"/><text x="796" y="494" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Décision</text><circle cx="32" cy="522" r="10" fill="#b3541e"/><text x="32" y="526" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="526" font-size="12" font-weight="400" fill="#262626" text-anchor="start">DG : rôle Direction. DGA : Direction et RH (cumul). Les rôles sont attribués par le Super administrateur désigné par le premier administrateur.</text><circle cx="32" cy="545" r="10" fill="#b3541e"/><text x="32" y="549" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="52" y="549" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Second facteur obligatoire pour tous ; codes de secours affichés une seule fois.</text><circle cx="32" cy="568" r="10" fill="#b3541e"/><text x="32" y="572" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="52" y="572" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Actions sensibles : confirmation du second facteur récente et confirmation à l’écran ; on ne modifie pas ses propres rôles.</text><text x="20" y="605" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Règles</text><text x="26" y="625" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Verrouillage après des échecs répétés ; message unique pour des identifiants invalides.</text><text x="26" y="644" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Au moins deux Super administrateurs nommés, sans compte partagé.</text><text x="20" y="673" font-size="13" font-weight="700" fill="#262626" text-anchor="start">Points à trancher</text><text x="26" y="693" font-size="12" font-weight="400" fill="#262626" text-anchor="start">• Le rôle RH de la DGA est minimal aujourd’hui : son périmètre viendra avec l’ERP RH.</text>
</svg>