<rect x="1200" y="0" width="300" height="900" rx="0" fill="#fff" stroke="none"/><line x1="1200" y1="0" x2="1200" y2="900" stroke="#c9c9c9"/><text x="1220" y="34" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start">37 · Reporting</text><text x="1220" y="58" font-size="17" font-weight="700" fill="#262626" text-anchor="start">Rapports des employés (vue</text><text x="1220" y="80" font-size="17" font-weight="700" fill="#262626" text-anchor="start">partagée)</text><rect x="1220" y="104" width="69" height="22" rx="11" fill="none" stroke="#b3541e"/><text x="1230" y="119" font-size="10" font-weight="700" fill="#b3541e" text-anchor="start">PROPOSÉ</text><text x="1220" y="146" font-size="10" font-weight="700" fill="#6b6b6b" text-anchor="start">Sprint</text><text x="1220" y="162" font-size="11" font-weight="400" fill="#262626" text-anchor="start">S6.3</text><text x="1220" y="185" font-size="10" font-weight="700" fill="#6b6b6b" text-anchor="start">Vue pour</text><text x="1220" y="201" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Tout employé (audience à définir)</text><text x="1220" y="224" font-size="10" font-weight="700" fill="#6b6b6b" text-anchor="start">Droits</text><text x="1220" y="240" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Vue partagée : audience (tous,</text><text x="1220" y="255" font-size="11" font-weight="400" fill="#262626" text-anchor="start">service, équipe) plutôt que portée par</text><text x="1220" y="270" font-size="11" font-weight="400" fill="#262626" text-anchor="start">propriétaire (D60).</text><line x1="1220" y1="299" x2="1480" y2="299" stroke="#c9c9c9"/><text x="1220" y="323" font-size="12" font-weight="700" fill="#262626" text-anchor="start">Annotations</text><circle cx="1230" cy="341" r="10" fill="#b3541e"/><text x="1230" y="345" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1248" y="345" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Vue partagée : chacun rédige le sien</text><text x="1248" y="360" font-size="11" font-weight="400" fill="#262626" text-anchor="start">; l’audience qui le lit reste à</text><text x="1248" y="375" font-size="11" font-weight="400" fill="#262626" text-anchor="start">décider. Le suivi des performances</text><text x="1248" y="390" font-size="11" font-weight="400" fill="#262626" text-anchor="start">n’est livré qu’après avis juridique</text><text x="1248" y="405" font-size="11" font-weight="400" fill="#262626" text-anchor="start">et RH.</text><circle cx="1230" cy="428" r="10" fill="#b3541e"/><text x="1230" y="432" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1248" y="432" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Export : même règle que partout</text><text x="1248" y="447" font-size="11" font-weight="400" fill="#262626" text-anchor="start">(lecture = export, trace) ; contenu</text><text x="1248" y="462" font-size="11" font-weight="400" fill="#262626" text-anchor="start">sensible à protéger.</text><line x1="1220" y1="495" x2="1480" y2="495" stroke="#c9c9c9"/><text x="1220" y="517" font-size="12" font-weight="700" fill="#262626" text-anchor="start">États à concevoir</text><text x="1220" y="537" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Audience non autorisée : vue absente</text><text x="1220" y="552" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Brouillon</text><text x="1220" y="567" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Chargement</text><text x="1220" y="582" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Vide</text><text x="1220" y="597" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Erreur (réessayer)</text><text x="1220" y="612" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Droits réduits</text><text x="1220" y="627" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Thème sombre</text><text x="1220" y="642" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Largeur &lt; 1024 px</text>
