<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Wireframe : Connexion">
<title>01 — Connexion</title>
