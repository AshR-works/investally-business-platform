<rect x="370" y="110" width="460" height="336" rx="10" fill="#fff" stroke="#c9c9c9"/><text x="386" y="154" font-size="24" font-weight="700" fill="#262626" text-anchor="start">Connexion</text><text x="386" y="176" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Accédez à votre espace de travail Investally.</text><text x="386" y="216" font-size="11" font-weight="600" fill="#6b6b6b" text-anchor="start">Adresse e-mail </text><text x="478.5" y="216" font-size="11" font-weight="400" fill="#b3541e" text-anchor="start">*</text><rect x="386" y="222" width="428" height="34" rx="6" fill="#fff" stroke="#c9c9c9"/><text x="386" y="278" font-size="11" font-weight="600" fill="#6b6b6b" text-anchor="start">Mot de passe * (œil : afficher)</text><rect x="386" y="284" width="428" height="34" rx="6" fill="#fff" stroke="#c9c9c9"/><circle cx="370" cy="218" r="10" fill="#b3541e"/><text x="370" y="222" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="386" y="340" width="116.80000000000001" height="32" rx="7" fill="#2f2c2a" stroke="#2f2c2a"/><text x="444.4" y="361" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Se connecter</text><rect x="386" y="388" width="428" height="42" rx="10" fill="#fff" stroke="#c9c9c9"/><line x1="398" y1="392" x2="802" y2="392" stroke="#e4e4e4"/><circle cx="410" cy="410" r="4" fill="#6b6b6b"/><text x="424" y="414" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Mot de passe oublié ?</text><circle cx="354" cy="124" r="10" fill="#b3541e"/><text x="354" y="128" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text>

<rect x="1200" y="0" width="300" height="900" rx="0" fill="#fff" stroke="none"/><line x1="1200" y1="0" x2="1200" y2="900" stroke="#c9c9c9"/><text x="1220" y="34" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start">01 · Accès</text><text x="1220" y="58" font-size="17" font-weight="700" fill="#262626" text-anchor="start">Connexion</text><rect x="1220" y="82" width="55" height="22" rx="11" fill="none" stroke="#2e7d32"/><text x="1230" y="97" font-size="10" font-weight="700" fill="#2e7d32" text-anchor="start">LIVRÉ</text><text x="1220" y="124" font-size="10" font-weight="700" fill="#6b6b6b" text-anchor="start">Sprint</text><text x="1220" y="140" font-size="11" font-weight="400" fill="#262626" text-anchor="start">S3.1 / H2</text><text x="1220" y="163" font-size="10" font-weight="700" fill="#6b6b6b" text-anchor="start">Vue pour</text><text x="1220" y="179" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Tout utilisateur</text><text x="1220" y="202" font-size="10" font-weight="700" fill="#6b6b6b" text-anchor="start">Droits</text><text x="1220" y="218" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Route publique ; verrouillage après</text><text x="1220" y="233" font-size="11" font-weight="400" fill="#262626" text-anchor="start">échecs répétés.</text><line x1="1220" y1="262" x2="1480" y2="262" stroke="#c9c9c9"/><text x="1220" y="286" font-size="12" font-weight="700" fill="#262626" text-anchor="start">Annotations</text><circle cx="1230" cy="304" r="10" fill="#b3541e"/><text x="1230" y="308" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1248" y="308" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Mot de passe masqué par défaut ;</text><text x="1248" y="323" font-size="11" font-weight="400" fill="#262626" text-anchor="start">bouton « œil » unique ; correction</text><text x="1248" y="338" font-size="11" font-weight="400" fill="#262626" text-anchor="start">orthographique coupée (EXD-12).</text><circle cx="1230" cy="361" r="10" fill="#b3541e"/><text x="1230" y="365" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1248" y="365" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Un code de l’application</text><text x="1248" y="380" font-size="11" font-weight="400" fill="#262626" text-anchor="start">d’authentification est demandé à</text><text x="1248" y="395" font-size="11" font-weight="400" fill="#262626" text-anchor="start">l’étape suivante (MFA obligatoire).</text><line x1="1220" y1="428" x2="1480" y2="428" stroke="#c9c9c9"/><text x="1220" y="450" font-size="12" font-weight="700" fill="#262626" text-anchor="start">États à concevoir</text><text x="1220" y="470" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Identifiants invalides (message</text><text x="1220" y="485" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">unique, sans dire lequel)</text><text x="1220" y="500" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Compte verrouillé</text><text x="1220" y="515" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Thème sombre</text>
</svg>