<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Wireframe : Second facteur : code à six chiffres">
<title>02 — Second facteur : code à six chiffres</title>
<rect width="1500" height="900" fill="#fafafa"/>

<rect x="370" y="110" width="460" height="276" rx="10" fill="#fff" stroke="#c9c9c9"/><text x="386" y="154" font-size="24" font-weight="700" fill="#262626" text-anchor="start">Vérification</text><text x="386" y="176" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Saisissez le code de votre application d’authentification.</text><rect x="386" y="204" width="46" height="56" rx="8" fill="#fff" stroke="#6b6b6b"/><rect x="442" y="204" width="46" height="56" rx="8" fill="#fff" stroke="#6b6b6b"/><rect x="498" y="204" width="46" height="56" rx="8" fill="#fff" stroke="#6b6b6b"/><rect x="554" y="204" width="46" height="56" rx="8" fill="#fff" stroke="#6b6b6b"/><rect x="610" y="204" width="46" height="56" rx="8" fill="#fff" stroke="#6b6b6b"/><rect x="666" y="204" width="46" height="56" rx="8" fill="#fff" stroke="#6b6b6b"/><circle cx="370" cy="218" r="10" fill="#b3541e"/><text x="370" y="222" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="386" y="280" width="87.2" height="32" rx="7" fill="#2f2c2a" stroke="#2f2c2a"/><text x="429.6" y="301" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Vérifier</text><rect x="386" y="328" width="428" height="42" rx="10" fill="#fff" stroke="#c9c9c9"/><line x1="398" y1="332" x2="802" y2="332" stroke="#e4e4e4"/><circle cx="410" cy="350" r="4" fill="#6b6b6b"/><text x="424" y="354" font-size="12" font-weight="400" fill="#262626" text-anchor="start">Utiliser un code de secours</text>

<rect x="1200" y="0" width="300" height="900" rx="0" fill="#fff" stroke="none"/><line x1="1200" y1="0" x2="1200" y2="900" stroke="#c9c9c9"/><text x="1220" y="34" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start">02 · Accès</text><text x="1220" y="58" font-size="17" font-weight="700" fill="#262626" text-anchor="start">Second facteur : code à six</text><text x="1220" y="80" font-size="17" font-weight="700" fill="#262626" text-anchor="start">chiffres</text><rect x="1220" y="104" width="55" height="22" rx="11" fill="none" stroke="#2e7d32"/><text x="1230" y="119" font-size="10" font-weight="700" fill="#2e7d32" text-anchor="start">LIVRÉ</text><text x="1220" y="146" font-size="10" font-weight="700" fill="#6b6b6b" text-anchor="start">Sprint</text><text x="1220" y="162" font-size="11" font-weight="400" fill="#262626" text-anchor="start">S3.2 / H2</text><text x="1220" y="185" font-size="10" font-weight="700" fill="#6b6b6b" text-anchor="start">Vue pour</text><text x="1220" y="201" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Tout utilisateur</text><text x="1220" y="224" font-size="10" font-weight="700" fill="#6b6b6b" text-anchor="start">Droits</text><text x="1220" y="240" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Après un mot de passe correct.</text><line x1="1220" y1="269" x2="1480" y2="269" stroke="#c9c9c9"/><text x="1220" y="293" font-size="12" font-weight="700" fill="#262626" text-anchor="start">Annotations</text><circle cx="1230" cy="311" r="10" fill="#b3541e"/><text x="1230" y="315" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1248" y="315" font-size="11" font-weight="400" fill="#262626" text-anchor="start">Six cases (DDR-0009) ; collage d’un</text><text x="1248" y="330" font-size="11" font-weight="400" fill="#262626" text-anchor="start">code complet accepté ; validation</text><text x="1248" y="345" font-size="11" font-weight="400" fill="#262626" text-anchor="start">automatique à la sixième.</text><line x1="1220" y1="378" x2="1480" y2="378" stroke="#c9c9c9"/><text x="1220" y="400" font-size="12" font-weight="700" fill="#262626" text-anchor="start">États à concevoir</text><text x="1220" y="420" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Code erroné</text><text x="1220" y="435" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Trop de tentatives</text><text x="1220" y="450" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">• Première connexion : enrôlement par QR</text><text x="1220" y="465" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">code</text>
</svg>