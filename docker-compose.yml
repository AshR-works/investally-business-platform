# Environnement de développement local. Les secrets viennent d'un fichier .env non versionné.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-investally}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investally}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/crm-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-investally}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-investally}
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    profiles: ["full"]

volumes:
  db-data:
