packages:
  - "apps/*"
allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  esbuild: false
  unrs-resolver: false
  workerd: false
  prisma: true
  '@prisma/engines': true
  '@embedded-postgres/windows-x64': false
  # Linux et macOS : le script d'installation recrée les liens symboliques des bibliothèques de PostgreSQL embarqué
  # (nécessaire à scripts/test-db.mjs). Sans cette déclaration, pnpm 12 refuse l'installation (ERR_PNPM_IGNORED_BUILDS).
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-ia32': true
  '@embedded-postgres/linux-ppc64': true
  '@embedded-postgres/linux-x64': true

# Correctifs de sécurité (audit du 2026-10-27) : dépendances indirectes de @nestjs/platform-express (déni de service).
# À retirer quand @nestjs/platform-express embarquera ces versions.
# Correctif de sécurité (audit du 2026-11-17, D73) : lodash vulnérable (injection de code via _.template),
# dépendance indirecte de prisma (devDependency, outil Studio local, jamais exécuté dans l'API déployée).
# À retirer quand @prisma/studio-core embarquera lodash >=4.18.1.
# Correctifs de sécurité (audit du 2026-11-24, D78) : effect (ReDoS) et fast-uri (usurpation/confusion d'URI),
# dépendances indirectes de prisma (devDependency : @prisma/config, @prisma/dev), jamais exécutées dans l'API déployée.
# À retirer quand prisma embarquera ces versions corrigées.
overrides:
  body-parser: '>=2.4.0'
  multer: '>=2.5.0'
  lodash@<4.18.1: '>=4.18.1'
  effect@<3.22.1: '>=3.22.1 <4.0.0'
  fast-uri@<3.1.9: '>=3.1.9 <4.0.0'
